apiVersion: v1
kind: Service
metadata:
  name: wayfinder-api
  annotations:
    cloud.google.com/backend-config: '{"default":"wayfinder-api-backend-config"}'
spec:
  type: ClusterIP
  selector: { app: wayfinder-api }
  ports: [{ name: http, port: 3001, targetPort: http }]
---
apiVersion: v1
kind: Service
metadata:
  name: backend
spec:
  type: ClusterIP
  selector: { app: wayfinder-api }
  ports: [{ name: http, port: 3001, targetPort: http }]
---
apiVersion: v1
kind: Service
metadata:
  name: wayfinder-web
  annotations:
    cloud.google.com/backend-config: '{"default":"wayfinder-web-backend-config"}'
spec:
  type: ClusterIP
  selector: { app: wayfinder-web }
  ports: [{ name: http, port: 8080, targetPort: http }]
