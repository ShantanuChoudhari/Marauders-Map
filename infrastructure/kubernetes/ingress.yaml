apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: wayfinder
  annotations:
    kubernetes.io/ingress.class: gce
    networking.gke.io/managed-certificates: wayfinder-cert
    kubernetes.io/ingress.global-static-ip-name: wayfinder-ip
spec:
  rules:
    - host: play.example.com
      http:
        paths:
          - path: /api
            pathType: Prefix
            backend: { service: { name: wayfinder-api, port: { number: 3001 } } }
          - path: /socket.io
            pathType: Prefix
            backend: { service: { name: wayfinder-api, port: { number: 3001 } } }
          - path: /
            pathType: Prefix
            backend: { service: { name: wayfinder-web, port: { number: 8080 } } }
---
apiVersion: networking.gke.io/v1
kind: ManagedCertificate
metadata:
  name: wayfinder-cert
spec:
  domains: [play.example.com]
---
apiVersion: cloud.google.com/v1
kind: BackendConfig
metadata:
  name: wayfinder-backend-config
spec:
  timeoutSec: 75
  connectionDraining: { drainingTimeoutSec: 30 }
---
apiVersion: cloud.google.com/v1
kind: BackendConfig
metadata:
  name: wayfinder-api-backend-config
spec:
  timeoutSec: 75
  connectionDraining: { drainingTimeoutSec: 30 }
  healthCheck: { checkIntervalSec: 15, timeoutSec: 5, healthyThreshold: 2, unhealthyThreshold: 3, type: HTTP, requestPath: /health, port: 3001 }
---
apiVersion: cloud.google.com/v1
kind: BackendConfig
metadata:
  name: wayfinder-web-backend-config
spec:
  timeoutSec: 75
  connectionDraining: { drainingTimeoutSec: 30 }
  healthCheck: { checkIntervalSec: 15, timeoutSec: 5, healthyThreshold: 2, unhealthyThreshold: 3, type: HTTP, requestPath: /health, port: 8080 }
